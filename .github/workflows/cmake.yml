name: Firmware Build

on:
  push:
    branches: [main, create-ao, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, create-ao, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install formatting tools
        run: |
          pip install pre-commit
          sudo apt-get update
          sudo apt-get install -y clang-format cmake-format
      
      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

  build:
    runs-on: ubuntu-latest
    needs: format-check
    container:
      image: ghcr.io/kodezine/kdocker:latest

    strategy:
      fail-fast: false
      matrix:
        preset: [
          "nucleo-753-can-eth-gnuarm14.3",
          "nucleo-753-can-eth-atfe21.1"
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git tags

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory /__w/nucleo-753-can-eth/nucleo-753-can-eth

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: List build artifacts
        working-directory: build/${{ matrix.preset }}
        run: |
          echo "Build artifacts:"
          ls -lh nucleo-753-can-eth.*
          
          # Display firmware size
          echo ""
          echo "Firmware size:"
          size -B nucleo-753-can-eth.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/nucleo-753-can-eth.elf
            build/${{ matrix.preset }}/nucleo-753-can-eth.hex
            build/${{ matrix.preset }}/nucleo-753-can-eth.bin
            build/${{ matrix.preset }}/nucleo-753-can-eth.map
          retention-days: 7
